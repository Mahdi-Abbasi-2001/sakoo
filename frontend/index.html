<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liara Launchpad</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%2313E2D0'/%3E%3Cpath d='M8 17l6-9 6 9M8 21h12' fill='none' stroke='%2303130F' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Runs before first paint: language, direction and theme come from storage, so nothing flips after load. */
(function () {
  var h = document.documentElement;
  try {
    var l = localStorage.getItem('lang'), th = localStorage.getItem('theme');
    if (l === 'fa' || l === 'en') { h.lang = l; h.dir = l === 'fa' ? 'rtl' : 'ltr'; }
    if (th === 'light' || th === 'dark') h.dataset.theme = th;
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
